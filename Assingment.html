<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #ffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            height: 630px;
            width: 570px;
            background-color: rgb(238, 52, 52);
            height: 100vh;
            position: relative;
        }

        .upper {
            height: 250px;
            width: 480px;
            background-color: rgb(252, 177, 189);
            position: absolute;
            top: 30px;
            right: 20px;
            left: 45px;
            border-radius: 22px;
        }

        .inside {
            height: 150px;
            width: 280px;
            background-color: cornsilk;
            border-radius: 22px;
            position: absolute;
            top: 45px;
            right: 20px;
            left: 91px;
        }

        .middle {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 350px;
            left: 30px;
            right: 30px;
        }

        .card {
            height: 130px;
            width: 130px;
            background-color: rgb(142, 59, 59);
            border-radius: 15px;
        }

        .last {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 550px;
            left: 30px;
            right: 30px;
        }

        .rect {
            height: 50px;
            width: 150px;
            background-color: #fff;
            border-radius: 35px;
        }
    </style>
</head>

<body>
    <div class="main-card">
        <div class="upper">
            <div class="inside">
            </div>
        </div>
        <div class="middle">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
        <div class="last">
            <div class="rect"></div>
            <div class="rect"></div>
            <div class="rect"></div>
        </div>
    </div>
</body>

</html>
